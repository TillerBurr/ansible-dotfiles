- name: Pre-create dirs stow must descend into
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/{{ item }}"
    state: directory
    mode: "{{ '0700' if item == '.gnupg' else '0755' }}"
  loop:
    - .config
    - .claude/hooks
    - .claude/skills
    - .claude/commands
    - .local/bin
    - .gnupg
    - .dippy

- name: Install stow
  when: ansible_os_family == 'Debian'
  become: true
  apt:
    name: stow
    state: present

- name: Find absolute ~/.claude links left by the old claude role
  ansible.builtin.stat:
    path: "{{ ansible_env.HOME }}/.claude/{{ item }}"
  loop: [settings.json, CLAUDE.md, graph-tool-routing.md, statusline-command.sh]
  register: old_claude_links

- name: Remove them
  ansible.builtin.file:
    path: "{{ item.stat.path }}"
    state: absent
  loop: "{{ old_claude_links.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.islnk | default(false) and item.stat.lnk_source.startswith(playbook_dir)
    and item.stat.lnk_target.startswith('/')

- name: Run Stow
  shell: "stow . --target {{ ansible_env.HOME }} --verbose=2"
  register: result
  changed_when: 'result.stderr is search("LINK: ")'

- name: Run ZSH_CUSTOM Stow
  shell: "stow -S custom_zsh --target {{ ansible_env.HOME }}/.oh-my-zsh/custom --verbose=2"
  register: result
  changed_when: 'result.stderr is search("LINK: ")'
