- name: Pre-create dirs stow must descend into
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/{{ item }}"
    state: directory
    mode: "{{ '0700' if item == '.gnupg' else '0755' }}"
  loop:
    - .config
    - .claude/hooks
    - .claude/skills
    - .claude/commands
    - .local/bin
    - .gnupg

- name: Install stow
  when: ansible_os_family == 'Debian'
  become: true
  apt:
    name: stow
    state: present

- name: Run Stow
  shell: "stow . --target {{ ansible_env.HOME }} --verbose=2"
  register: result
  changed_when: 'result.stderr is search("LINK: ")'

- name: Run ZSH_CUSTOM Stow
  shell: "stow -S custom_zsh --target {{ ansible_env.HOME }}/.oh-my-zsh/custom --verbose=2"
  register: result
  changed_when: 'result.stderr is search("LINK: ")'
